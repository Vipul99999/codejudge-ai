name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Lint API
        run: python -m ruff check apps/api
      - name: Format check API
        run: python -m ruff format --check apps/api
      - name: Type check API
        run: python -m mypy apps/api/app
      - name: Test API
        run: python -m pytest apps/api/tests

  web-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Install root dependencies
        run: npm install
      - name: Type check contracts
        run: npm --prefix packages/contracts run typecheck
      - name: Test contracts
        run: npm --prefix packages/contracts run test
      - name: Type check web
        run: npm --prefix apps/web run typecheck
      - name: Test web
        run: npm --prefix apps/web run test
